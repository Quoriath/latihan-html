<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 28px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            display: block;
            padding: 14px 18px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            color: #222;
            text-decoration: none;
            background: #fafafa;
            transition: 0.2s;
        }

        a:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Repository</h1>
    <ul id="list"></ul>
</div>

<script>
const path = location.pathname.split("/").filter(Boolean);
const owner = location.hostname.split(".")[0];
const repo = path[0] || `${owner}.github.io`;

fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`)
    .then(r => r.json())
    .then(data => {
        const list = document.getElementById("list");

        if (!data.tree) {
            list.innerHTML = "<li>Repository tidak ditemukan</li>";
            return;
        }

        data.tree
            .filter(item => item.type === "blob" && item.path !== "index.html")
            .forEach(item => {
                const li = document.createElement("li");
                const a = document.createElement("a");

                a.textContent = item.path;
                a.href = `/${repo}/${item.path}`;
                a.target = "_self";

                li.appendChild(a);
                list.appendChild(li);
            });
    })
    .catch(() => {
        document.getElementById("list").innerHTML =
            "<li>Gagal mengambil isi repository</li>";
    });
</script>

</body>
</html>
