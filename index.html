<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonatan Firdausi — XI RPL 2</title>
    <!-- Three.js CDN untuk render 3D Globe Realistic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #020617;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: #ffffff;
        }

        /* Canvas Fullscreen */
        #globe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Mouse Glow Follower */
        .cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(147, 51, 234, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            will-change: transform;
        }

        /* Overlay UI Container */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }

        /* Minimal Elegant Identity (Top Right Corner) */
        .identity-badge {
            position: fixed;
            top: 2rem;
            right: 2.5rem;
            z-index: 20;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1.2rem;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .identity-badge:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            animation: pulse 2s infinite;
        }

        .identity-text {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.95);
        }

        .identity-divider {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
        }

        .identity-class {
            font-size: 0.8rem;
            font-weight: 500;
            color: #60a5fa;
            letter-spacing: 0.05em;
        }

        /* Interactive Hint (Bottom Center) */
        .interaction-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .identity-badge {
                top: 1.2rem;
                right: 1.2rem;
                padding: 0.5rem 1rem;
            }
            .identity-text { font-size: 0.78rem; }
            .identity-class { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- 3D Globe WebGL Canvas -->
    <canvas id="globe-canvas"></canvas>

    <!-- Cursor Ambient Glow -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="ui-layer">
        <!-- Identity Badge (Top Corner) -->
        <div class="identity-badge">
            <span class="status-dot"></span>
            <span class="identity-text">Jonatan Firdausi</span>
            <span class="identity-divider">/</span>
            <span class="identity-class">XI RPL 2</span>
        </div>

        <!-- Hint -->
        <div class="interaction-hint">Drag / Scroll to Rotate & Zoom</div>
    </div>

    <script>
        // --- 1. Three.js Scene Setup ---
        const canvas = document.getElementById('globe-canvas');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        // --- 2. Lighting Setup ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(12, 6, 10);
        scene.add(sunLight);

        // --- 3. Earth Group & Real Textures ---
        const earthGroup = new THREE.Group();
        earthGroup.rotation.z = 23.4 * Math.PI / 180; // Sumbu rotasi bumi ~23.4°
        scene.add(earthGroup);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        // High-res Earth Textures (NASA Satellite Imagery CDN)
        const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const bumpMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const specularMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png');

        // Permukaan Bumi Utama
        const earthGeo = new THREE.SphereGeometry(4.8, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
            map: earthMap,
            bumpMap: bumpMap,
            bumpScale: 0.05,
            specularMap: specularMap,
            specular: new THREE.Color(0x333333),
            shininess: 15
        });

        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earthMesh);

        // Lapisan Awan (Clouds Layer)
        const cloudsMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');
        const cloudsGeo = new THREE.SphereGeometry(4.86, 64, 64);
        const cloudsMat = new THREE.MeshStandardMaterial({
            map: cloudsMap,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });

        const cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
        earthGroup.add(cloudsMesh);

        // Lapisan Pendar Atmosfer (Atmosphere Glow)
        const atmosGeo = new THREE.SphereGeometry(5.2, 64, 64);
        const atmosMat = new THREE.MeshBasicMaterial({
            color: 0x3b82f6,
            transparent: true,
            opacity: 0.12,
            side: THREE.BackSide
        });
        const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        earthGroup.add(atmosMesh);

        // --- 4. Background Starfield (Bintang-Bintang) ---
        const starCount = 600;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            const r = 40 + Math.random() * 60;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            starPos[i] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i + 2] = r * Math.cos(phi);
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            opacity: 0.7
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- 5. Interaktivitas Drag & Mouse Follow ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0;
        let targetRotationY = 0;
        let mouseX = 0, mouseY = 0;

        const cursorGlow = document.getElementById('cursorGlow');

        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            cursorGlow.style.left = `${mouseX}px`;
            cursorGlow.style.top = `${mouseY}px`;

            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        // Scroll to Zoom
        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.008;
            camera.position.z = Math.min(Math.max(camera.position.z, 8), 25);
        });

        // --- 6. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotasi alami Bumi
            earthMesh.rotation.y += 0.0015;

            // Rotasi lapisan Awan sedikit lebih cepat dari daratan
            cloudsMesh.rotation.y += 0.002;

            // Transisi pergerakan drag pengguna
            earthGroup.rotation.y += (targetRotationY - earthGroup.rotation.y) * 0.05;
            earthGroup.rotation.x += (targetRotationX - earthGroup.rotation.x) * 0.05;

            // Rotasi latar bintang yang sangat lambat
            starField.rotation.y = elapsedTime * 0.005;

            renderer.render(scene, camera);
        }

        animate();

        // --- 7. Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
