<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository</title>
</head>
<body>

<h1>Repository</h1>
<ul id="list"></ul>

<script>
const path = location.pathname.split("/").filter(Boolean);
const owner = location.hostname.split(".")[0];
const repo = path[0] || `${owner}.github.io`;

fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`)
    .then(r => r.json())
    .then(data => {
        const list = document.getElementById("list");

        if (!data.tree) {
            list.innerHTML = "<li>Repositorynya ndak ada</li>";
            return;
        }

        data.tree
            .filter(item => item.type === "blob" && item.path !== "index.html")
            .forEach(item => {
                const li = document.createElement("li");
                const a = document.createElement("a");

                a.textContent = item.path;
                a.href = `/${repo}/${item.path}`;
                a.target = "_self";

                li.appendChild(a);
                list.appendChild(li);
            });
    })
    .catch(() => {
        document.getElementById("list").innerHTML =
            "<li>Ledukk</li>";
    });
</script>

</body>
</html>
